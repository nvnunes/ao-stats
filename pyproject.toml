[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ao-stats"
description = "Strehl, enclosed-energy, and FWHM measurements for adaptive-optics PSFs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Nelson V. Nunes", email = "nvnunes@yorku.ca"},
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=7.0.0",
    "contourpy>=1.3.0",
    "numpy>=2.2.0",
    "photutils>=2.0.0",
    "scipy>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/nvnunes/ao-stats"
Documentation = "https://github.com/nvnunes/ao-stats#readme"
Repository = "https://github.com/nvnunes/ao-stats"
Issues = "https://github.com/nvnunes/ao-stats/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff",
]
docs = [
    "mkdocs>=1.6.0,<2.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ao_stats*"]

[tool.setuptools.dynamic]
version = {attr = "ao_stats._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Keep the public type aliases available at runtime.
ignore = ["UP040"]
