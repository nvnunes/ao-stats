site_name: AO Stats
site_description: Strehl, enclosed-energy, and FWHM measurements for adaptive-optics PSFs
repo_name: ao-stats
docs_dir: docs
strict: true

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            show_root_heading: true
            show_source: false
            heading_level: 2
            members_order: source

nav:
  - Home: index.md
  - Guides:
      - API: api.md
      - Architecture: architecture.md
      - Development: development.md
      - Testing: testing.md
  - Reference:
      - Python API: reference/api.md
